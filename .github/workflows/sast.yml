name: SAST

# Static analysis of our own source: gosec (Go controller/worker) + Bandit (Python ML).
# Repo is private without GitHub Advanced Security, so both run entirely in CI and
# fail the job on findings. Reviewed false-positives: gosec `#nosec <rule> // reason`,
# Bandit `# nosec <ID>` + reason.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# staffops-otel-libs had its history rewritten (git filter-repo, 2026-10-28): its
# go/v0.2.x tags no longer match sum.golang.org and proxy.golang.org does not serve
# it. Fetch it directly and skip the checksum DB; go.sum pins the current hash.
# Remove once we move to otel-libs 0.3.0 (module path github.com/staffops/otel-libs/go).
env:
  GOPRIVATE: "github.com/staffops/*"
  GONOSUMDB: "github.com/staffops/*"

jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: controller/go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: gosec
        working-directory: controller
        run: gosec ./...

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: Bandit (medium+ severity, medium+ confidence)
        run: bandit -r ml/server -x ml/server/generated --severity-level medium --confidence-level medium
